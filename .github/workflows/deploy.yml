name: Build, Push to Docker Hub & Deploy to EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Build and Push Docker Images to Docker Hub
  # =========================================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Expense-and-Spliter-Backend
          file: ./Expense-and-Spliter-Backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-splitter-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-splitter-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Expense-and-Spliter-Frontend
          file: ./Expense-and-Spliter-Frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-splitter-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-splitter-frontend:${{ github.sha }}

  # =========================================================================
  # 2. Automated Deployment to AWS EC2 Instance via SSH
  # =========================================================================
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Containers on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            # 1. Ensure deployment directory exists
            mkdir -p ~/app
            cd ~/app

            # 2. Write docker-compose.yml directly
            cat << 'EOF' > docker-compose.yml
            version: '3.8'

            services:
              backend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/expense-splitter-backend:latest
                container_name: expense-splitter-backend
                restart: always
                ports:
                  - "5000:5000"
                environment:
                  - PORT=5000
                  - MONGO_URI=${MONGO_URI}
                  - JWT_SECRET=${JWT_SECRET}
                  - GROQ_API_KEY=${GROQ_API_KEY}
                  - FRONTEND_URL=${FRONTEND_URL}
                networks:
                  - app-network

              frontend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/expense-splitter-frontend:latest
                container_name: expense-splitter-frontend
                restart: always
                ports:
                  - "80:80"
                depends_on:
                  - backend
                networks:
                  - app-network

            networks:
              app-network:
                driver: bridge
            EOF

            # 3. Write .env file
            cat << EOF > .env
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            MONGO_URI=${{ secrets.MONGO_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            FRONTEND_URL=http://${{ secrets.EC2_HOST }}
            PORT=5000
            EOF

            # 4. Authenticate Docker with Docker Hub on EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 5. Pull updated images & restart containers
            docker compose pull
            docker compose up -d --remove-orphans --force-recreate

            # 6. Cleanup obsolete dangling images
            docker image prune -af --filter "until=48h"

            echo "🚀 Deployment completed successfully on EC2!"
