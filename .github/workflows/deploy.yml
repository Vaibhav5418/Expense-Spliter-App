name: Build, Push to Docker Hub & Deploy to EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Build and Push Docker Images to Docker Hub
  # =========================================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Expense-and-Spliter-Backend
          file: ./Expense-and-Spliter-Backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-splitter-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-splitter-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Expense-and-Spliter-Frontend
          file: ./Expense-and-Spliter-Frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-splitter-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-splitter-frontend:${{ github.sha }}

  # =========================================================================
  # 2. Automated Deployment to AWS EC2 Instance via SSH
  # =========================================================================
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Containers on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            # 1. Ensure deployment directory exists
            mkdir -p ~/app
            cd ~/app

            # 2. Write .env file
            printf "%s\n" \
              "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" \
              "MONGO_URI=${{ secrets.MONGO_URI }}" \
              "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
              "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" \
              "FRONTEND_URL=http://${{ secrets.EC2_HOST }}" \
              "PORT=5000" > .env

            # 3. Write docker-compose.yml cleanly using env_file
            printf "%s\n" \
              "services:" \
              "  backend:" \
              "    image: ${{ secrets.DOCKERHUB_USERNAME }}/expense-splitter-backend:latest" \
              "    container_name: expense-splitter-backend" \
              "    restart: always" \
              "    ports:" \
              '      - "5000:5000"' \
              "    env_file:" \
              "      - .env" \
              "    networks:" \
              "      - app-network" \
              "" \
              "  frontend:" \
              "    image: ${{ secrets.DOCKERHUB_USERNAME }}/expense-splitter-frontend:latest" \
              "    container_name: expense-splitter-frontend" \
              "    restart: always" \
              "    ports:" \
              '      - "80:80"' \
              "    depends_on:" \
              "      - backend" \
              "    networks:" \
              "      - app-network" \
              "" \
              "networks:" \
              "  app-network:" \
              "    driver: bridge" > docker-compose.yml

            # 4. Auto-detect Docker and Docker Compose (support sudo / standalone)
            if docker ps >/dev/null 2>&1; then
                DOCKER="docker"
            elif sudo docker ps >/dev/null 2>&1; then
                DOCKER="sudo docker"
            else
                echo "❌ Error: Docker daemon is not running or accessible!"
                exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
                COMPOSE="docker compose"
            elif docker-compose --version >/dev/null 2>&1; then
                COMPOSE="docker-compose"
            elif sudo docker compose version >/dev/null 2>&1; then
                COMPOSE="sudo docker compose"
            elif sudo docker-compose --version >/dev/null 2>&1; then
                COMPOSE="sudo docker-compose"
            else
                echo "❌ Error: Docker Compose is not installed on EC2!"
                exit 1
            fi

            # 5. Authenticate Docker with Docker Hub on EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | $DOCKER login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 6. Validate configuration
            $COMPOSE config

            # 7. Pull updated images & restart containers
            $COMPOSE pull
            $COMPOSE up -d --remove-orphans --force-recreate

            # 8. Cleanup obsolete dangling images
            $DOCKER image prune -af --filter "until=48h" || true

            # 9. Check status
            echo "--- Active Container Status ---"
            $COMPOSE ps

            echo "🚀 Deployment completed successfully on EC2!"
